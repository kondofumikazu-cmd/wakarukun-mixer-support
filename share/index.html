<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src wss://fumixer-caption-sharing.kondofumikazu.workers.dev; base-uri 'none'; form-action 'none'">
  <title>リアルタイム字幕 · KF文字起こしミキサー</title>
  <link rel="stylesheet" href="./viewer.css?v=20261025-collaboration1">
  <script src="./viewer.js?v=20261025-collaboration1" type="module"></script>
</head>
<body>
  <header><p class="brand">KF文字起こしミキサー</p><h1 id="title">リアルタイム字幕</h1>
    <p id="status" role="status" aria-live="polite">接続を準備しています…</p></header>
  <main>
    <section id="entry" aria-labelledby="entry-title">
      <h2 id="entry-title">この文字起こしを開く</h2>
      <p>字幕を見るか、自分のマイクで文字起こしに参加するかを選んでください。</p>
      <div class="entry-actions"><button id="choose-view" type="button">閲覧する</button><a id="join-app" hidden>文字起こしに参加する</a></div>
      <p>閲覧はブラウザーで利用できます。参加するには、iPhone・iPadまたはAndroidに最新版のKF文字起こしミキサーが必要です。アプリで参加者名を入力し、マイクを開始します。</p>
    </section>
    <div id="captions" aria-label="共有された字幕"></div><p id="empty" hidden>相手の字幕を待っています。</p>
  </main>
  <footer id="viewer-controls" hidden>
    <div class="controls"><label>文字の大きさ <input id="size" type="range" min="18" max="60" step="2" value="30"></label>
      <label><input id="furigana" type="checkbox"> ふりがなを表示</label>
      <label><input id="follow" type="checkbox" checked> 最新に追従</label><button id="stop" type="button">閲覧を終了</button></div>
    <p>字幕は共有元と閲覧先で暗号化・復号されます。QRコードやリンクを知っている人が閲覧できます。共有の停止後は新しい字幕を受信しません。</p>
  </footer>
</body>
</html>
